name: testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python tests/test_pipeline.py
      - run: python app.py --self-test
      - name: build exe
        run: python -m PyInstaller --noconfirm --clean --windowed --name Cratekeeper --icon organizador\recursos\cratekeeper.ico --add-data "organizador\recursos;organizador\recursos" --exclude-module librosa --exclude-module numba --exclude-module scipy --exclude-module sklearn app.py
      - name: packaged app starts
        shell: pwsh
        run: |
          Start-Process dist\Cratekeeper\Cratekeeper.exe -ArgumentList "--self-test" -Wait
          Get-Content cratekeeper-self-test.log
          # ExitCode of a windowed app is not reliable through Start-Process; the log line is
          if (-not (Select-String -Quiet -Pattern "^self-test ok" -Path cratekeeper-self-test.log)) { exit 1 }
