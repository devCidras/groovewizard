name: testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python tests/test_pipeline.py
      - name: app starts (source)
        shell: pwsh
        run: |
          python app.py --self-test
          # exit code is unreliable after the hard exit that skips Qt teardown; the log line is what counts
          if (-not (Select-String -Quiet -Pattern "^self-test ok" -Path groovewizard-self-test.log)) { exit 1 }
          Remove-Item groovewizard-self-test.log
          exit 0
      - name: release build (same script as the installer, without Inno Setup) + packaged app starts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -SemInstalador
